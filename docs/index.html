<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vajram Suite Results</title>
<style>
:root {
  --bg: #f7f7f5; --card: #ffffff; --ink: #1d1d1f; --muted: #6e6e73; --line: #e4e4e0;
  --accent: #1a73e8; --accent-soft: #cfe3fc; --best-other: #e6e7ea;
  --m1: #5b6b82; --m2: #8a96a8; --m3: #a9b2bf; --m4: #c3c9d2; --m5: #7a8799; --m6: #9aa5b4; --m7: #b6bec9;
  --track: #f0f0ec; --chip: #efefeb;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111214; --card: #1a1b1e; --ink: #ececee; --muted: #9a9aa2; --line: #2a2b30;
    --accent: #6aa8ff; --accent-soft: #1d3557; --best-other: #33353c;
    --m1: #7d8ba0; --m2: #67748a; --m3: #56627a; --m4: #8e9ab0; --m5: #4b566c; --m6: #a3adc0; --m7: #3f495e;
    --track: #23242a; --chip: #24252b;
  }
}
:root[data-theme="dark"] {
  --bg: #111214; --card: #1a1b1e; --ink: #ececee; --muted: #9a9aa2; --line: #2a2b30;
  --accent: #6aa8ff; --accent-soft: #1d3557; --best-other: #33353c;
  --m1: #7d8ba0; --m2: #67748a; --m3: #56627a; --m4: #8e9ab0; --m5: #4b566c; --m6: #a3adc0; --m7: #3f495e;
  --track: #23242a; --chip: #24252b;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Noto Sans Kannada", sans-serif; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 32px 16px 64px; }
h1 { font-size: 30px; letter-spacing: -0.02em; margin: 0 0 6px; }
.sub { color: var(--muted); max-width: 820px; margin: 0 0 22px; font-size: 14px; }
.controls { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; margin: 0 0 22px; }
.seg { display: inline-flex; background: var(--chip); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 13px; font-weight: 600;
  padding: 6px 14px; border-radius: 999px; cursor: pointer; }
.seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
label.tog { font-size: 13px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 16px; margin: 0 0 18px; font-size: 13px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
.hero { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px 22px 14px; margin-bottom: 30px; }
.hero h2 { margin: 0; font-size: 17px; }
.hero .meta { color: var(--muted); font-size: 13px; margin: 2px 0 10px; }
.summary { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 26px; }
.pill { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; font-size: 13px; color: var(--muted); }
.pill b { color: var(--ink); font-size: 18px; display: block; }
.pill.acc b { color: var(--accent); }
h3.sec { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 30px 0 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 14px 8px; }
.card h4 { margin: 0; font-size: 15px; }
.card .meta { color: var(--muted); font-size: 12px; margin: 1px 0 6px; }
.badge { font-size: 10.5px; padding: 1px 6px; border-radius: 6px; background: var(--chip); color: var(--muted); margin-left: 6px; vertical-align: 2px; }
.badge.win { background: var(--accent-soft); color: var(--accent); }
.chart { display: grid; align-items: end; gap: 6px; position: relative; }
.col { display: flex; flex-direction: column; align-items: center; min-width: 0; }
.barbox { width: 100%; display: flex; align-items: flex-end; justify-content: center; position: relative; }
.bar { width: 78%; max-width: 46px; border-radius: 6px 6px 2px 2px; transition: height .35s ease; position: relative; }
.val { font-size: 11.5px; font-weight: 650; margin-bottom: 3px; font-variant-numeric: tabular-nums; }
.val.best { color: var(--ink); }
.val:not(.best) { color: var(--muted); font-weight: 550; }
.lab { font-size: 11px; color: var(--muted); text-align: center; margin-top: 6px; line-height: 1.2;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.lab.acc { color: var(--accent); font-weight: 650; }
.hero .bar { max-width: 74px; }
.hero .val { font-size: 15px; }
.hero .lab { font-size: 12.5px; }
.hero .lab small { display: block; font-size: 11px; opacity: .8; }
.gridlines { position: absolute; left: 0; right: 0; top: 0; pointer-events: none; }
.gridlines div { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--line); }
.foot { color: var(--muted); font-size: 12.5px; margin-top: 36px; max-width: 900px; }
.tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px; padding: 5px 8px;
  border-radius: 6px; opacity: 0; transition: opacity .1s; z-index: 9; white-space: nowrap; }
.theme { margin-left: auto; border: 1px solid var(--line); background: var(--card); color: var(--muted); border-radius: 999px;
  font: inherit; font-size: 12px; padding: 5px 11px; cursor: pointer; }
.picker { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 20px; }
.picker .lbl { font-size: 13px; color: var(--muted); margin-right: 2px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--card); color: var(--ink);
  font: inherit; font-size: 12.5px; padding: 4px 10px 4px 8px; border-radius: 999px; cursor: pointer; user-select: none; }
.chip i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
.chip small { color: var(--muted); font-size: 11px; }
.chip.off { opacity: .42; background: transparent; }
.chip.off i { background: transparent !important; outline: 1px solid var(--muted); }
.chip.mini { color: var(--muted); padding: 4px 10px; }
.tabs { display: inline-flex; gap: 18px; border-bottom: 1px solid var(--line); margin: 0 0 18px; }
.tabs button { border: 0; background: none; font: inherit; font-size: 14px; font-weight: 600; color: var(--muted); padding: 6px 2px 9px;
  cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--accent); }
.tblwrap { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 6px 0; }
table.lb { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 760px; font-size: 13.5px; }
table.lb th, table.lb td { padding: 9px 12px; text-align: center; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.lb thead th { font-weight: 600; font-size: 12.5px; color: var(--ink); vertical-align: bottom; border-bottom: 1px solid var(--line); }
table.lb thead th small { display: block; color: var(--muted); font-weight: 400; font-size: 11px; }
table.lb th.sec, table.lb td.sec { text-align: left; color: var(--muted); font-size: 12px; font-weight: 400; vertical-align: top;
  white-space: normal; width: 120px; padding-left: 16px; }
table.lb td.name { text-align: left; font-weight: 500; }
table.lb td.sub { text-align: right; color: var(--muted); font-size: 11.5px; padding-right: 16px; }
table.lb tr.first td { border-top: 1px solid var(--muted); }
table.lb td.v, table.lb th.v { border-left: 2px solid var(--accent); border-right: 2px solid var(--accent); }
table.lb thead th.v { border-top: 2px solid var(--accent); border-radius: 6px 6px 0 0; }
table.lb tr:last-child td.v { border-bottom: 2px solid var(--accent); }
table.lb td.best { font-weight: 650; background: var(--best-other); }
table.lb td.v.best { background: var(--accent-soft); }
table.lb td.sec { border-bottom-color: transparent; }
table.lb tr.lastsec td.sec { border-bottom-color: var(--line); }
table.lb td .k { color: var(--muted); font-size: 10.5px; display: block; font-weight: 400; }
h2.tt { font-size: 18px; margin: 8px 2px 12px; letter-spacing: -0.01em; }
h2.tt span { color: var(--muted); font-weight: 400; font-size: 14px; }
.method { color: var(--muted); font-size: 12.5px; margin: 12px 2px 26px; }
@media (max-width: 520px) { h1 { font-size: 24px; } .hero { padding: 16px 12px 10px; } .hero .val { font-size: 12.5px; } .hero .lab { font-size: 11px; } }
</style>
</head>

<div class="wrap">
  <h1>Vajram eval suite</h1>
  <p class="sub" id="sub"></p>
  <div class="controls">
    <div class="seg" id="pass">

  <div id="chartView" hidden>

  <div class="hero">

    <div id="hero"></div>
  </div>
  <div class="summary" id="summary"></div>
  <div id="sections"></div>

  <p class="foot" id="foot"></p>
</div>

        return `<td class="${i === vi ? "v" : ""}${isBest ? " best" : ""}">${has ? v.toFixed(r.digits ?? 1) + r.unit : "–"}</td>`;
      }).join("");
      const cls = [j === 0 ? "first" : "", j === sec.rows.length - 1 ? "lastsec" : ""].join(" ");
      rows.push(`<tr class="${cls}">${j === 0 ? `<td class="sec" rowspan="${sec.rows.length}">${sec.name}</td>` : ""}` +
        `<td class="name">${r.name}</td><td class="sub">${r.sub}</td>${cells}</tr>`);
    });
  }
  document.getElementById("lb2").innerHTML = head + "<tbody>" + rows.join("") + "</tbody>";
  document.getElementById("method2").textContent = D.bench_note;
}
function renderDecision() {
  const T = D.decision;
  if (!T) return;
  document.getElementById("decBlock").hidden = false;
  const keep = T.cols.map((c, i) => [c, i]).filter(([c]) => !c.family || shown.has(c.family));
  const cols = keep.map(([c]) => c), idx = keep.map(([, i]) => i);
  const head = `<thead><tr><th class="sec"></th><th style="text-align:left">Measure</th><th></th>` +
    cols.map(c => `<th class="${c.vajram ? "v" : ""}">${c.label}<small>${c.size}</small></th>`).join("") + `</tr></thead>`;
  const rows = [];
  for (const sec of T.sections) {
    sec.rows.forEach((r, j) => {
      const vals = idx.map(i => r.vals[i]);
      const nums = vals.filter(x => x !== null && x !== undefined);
      const best = nums.length ? (r.better === "min" ? Math.min(...nums) : Math.max(...nums)) : null;
      const cells = vals.map((x, i) => {
        const has = x !== null && x !== undefined, isBest = has && Math.abs(x - best) < 1e-9;
        const txt = has ? (Number.isInteger(x) && r.unit !== "%" ? x : x.toFixed(r.unit === " ms" ? 0 : 1)) + r.unit : "–";
        return `<td class="${cols[i].vajram ? "v" : ""}${isBest ? " best" : ""}">${txt}</td>`;
      }).join("");
      const cls = [j === 0 ? "first" : "", j === sec.rows.length - 1 ? "lastsec" : ""].join(" ");
      rows.push(`<tr class="${cls}">${j === 0 ? `<td class="sec" rowspan="${sec.rows.length}">${sec.name}</td>` : ""}` +
        `<td class="name">${r.name}</td><td class="sub">${r.sub}</td>${cells}</tr>`);
    });
  }
  document.getElementById("lb3").innerHTML = head + "<tbody>" + rows.join("") + "</tbody>";
  document.getElementById("method3").textContent = D.decision_note;
}
function render() {
  renderPicker();
  renderTable();
  renderBench();
  renderDecision();
  const ms = VM(), vi = ms.findIndex(m => isLatest(m.key));
  document.getElementById("sub").textContent = D.note;
  document.getElementById("legend").innerHTML = ms.map(m =>
    `<span><i style="background:${color(m)}"></i>${m.label} <span style="color:var(--muted)">${m.size}</span></span>`).join("")
    + (D.pending.length ? `<span style="color:var(--muted)">· still running: ${D.pending.join(", ")}</span>` : "");
  const all = caseIds(null);
  const hero = document.getElementById("hero"); hero.innerHTML = "";
  const h = chart(all, 230, true); hero.appendChild(h.el);
  document.getElementById("heroMeta").textContent = `${all.length} cases${withSys ? " incl. the built-in tool cases" : " every model answers"} · ${pass === "greedy" ? "greedy decoding" : "each model's recommended sampling"}`;
  const secs = document.getElementById("sections"); secs.innerHTML = "";
  let wins = 0, ties = 0, scen = 0, ranks = [];
  for (const sec of D.sections) {
    const cards = [];
    for (const sc of sec.scenarios) {
      const ids = caseIds(sc.key);
      if (!ids.length) continue;
      scen++;
      const c = chart(ids, 120, false);
      const v = vi >= 0 ? c.scores[vi].pct : -1, nBest = c.scores.filter(s => Math.abs(s.pct - c.best) < 1e-9).length;
      const vBest = vi >= 0 && Math.abs(v - c.best) < 1e-9;
      if (vBest && nBest === 1) wins++; else if (vBest) ties++;
      if (vi >= 0) ranks.push(1 + c.scores.filter(s => s.pct > v + 1e-9).length);
      const card = document.createElement("div"); card.className = "card";
      card.innerHTML = `<h4>${sc.name}${vBest ? `<span class="badge win">${nBest === 1 ? "Vajram best" : "Vajram tied best"}</span>` : ""}${ids.length < 5 ? '<span class="badge">small sample</span>' : ""}</h4><div class="meta">${ids.length} case${ids.length > 1 ? "s" : ""} · % passed</div>`;
      card.appendChild(c.el); cards.push(card);
    }
    if (!cards.length) continue;
    const t = document.createElement("h3"); t.className = "sec"; t.textContent = sec.name; secs.appendChild(t);
    const g = document.createElement("div"); g.className = "grid"; cards.forEach(c => g.appendChild(c)); secs.appendChild(g);
  }
  if (vi < 0) {
    document.getElementById("summary").innerHTML = `<div class="pill">Select Vajram to see its rank among the chosen models.</div>`;
    return;
  }
  const hv = h.scores[vi];
  const rankAll = 1 + h.scores.filter(s => s.pct > hv.pct + 1e-9).length;
  const med = ranks.sort((a, b) => a - b)[Math.floor(ranks.length / 2)];
  document.getElementById("summary").innerHTML = [
    ["acc", `${hv.pct.toFixed(1)}%`, `Vajram overall (${hv.k} / ${hv.n})`],
    ["", `#${rankAll} of ${ms.length}`, "Vajram's overall rank among the selected models"],
    ["acc", `${wins}`, `scenarios where Vajram is best${ties ? ` (+${ties} tied)` : ""}`],
    ["", `#${med}`, `Vajram's median rank across ${scen} scenarios`],
  ].map(([c, b, s]) => `<div class="pill ${c}"><b>${b}</b>${s}</div>`).join("");
  document.getElementById("foot").textContent = "Automatic first-pass checks (keywords, numbers, reply language, format, refusals, loops); manual review is the final word. "
    + "Scenarios with few cases move a lot with a single answer. Vajram runs through its demo server (built-in tools, loop guard); the other models run bare on llama-server with their own chat templates, all Q8_0 on one A100.";
}
document.querySelectorAll("#pass button").forEach(b => b.onclick = () => {
  document.querySelectorAll("#pass button").forEach(x => x.classList.toggle("on", x === b)); pass = b.dataset.v; render(); });
document.getElementById("sys").onchange = e => { withSys = e.target.checked; render(); };
document.getElementById("theme").onclick = () => {
  const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark"; render(); };
document.querySelectorAll("#view button").forEach(b => b.onclick = () => {
  document.querySelectorAll("#view button").forEach(x => x.classList.toggle("on", x === b));
  document.getElementById("tableView").hidden = b.dataset.v !== "table";
  document.getElementById("chartView").hidden = b.dataset.v !== "charts"; });
render();
</script>
</body>
